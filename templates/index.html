<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <div class="chat-container">
        <!-- ========== HEADER ========== -->
        <div class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bot-details">
                    <h2>AI Learning Assistant</h2>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Online</span>
                        <span class="doc-status" id="docStatus">Loading...</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <!-- Language Selector -->
                <select id="languageSelect" onchange="changeLanguage()" class="lang-select" title="Select Language">
                    <option value="en">🇬🇧 EN</option>
                    <option value="si">🇱🇰 සිංහල</option>
                    <option value="ta">🇱🇰 தமிழ்</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="de">🇩🇪 DE</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
                <button class="new-chat-btn" onclick="startNewChat()" title="New Conversation">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- ========== MESSAGES AREA ========== -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h3>Welcome to Your AI Study Assistant! 👋</h3>
                <p>I'm here to help you understand your course materials. Ask me anything about your lecture notes, and I'll give you clear, simple answers.</p>
                <div class="suggestion-chips">
                    <button onclick="sendSuggestion('What is a project?')" class="chip">
                        <i class="fas fa-bullseye"></i> What is a project?
                    </button>
                    <button onclick="sendSuggestion('Explain the factors affecting software development')" class="chip">
                        <i class="fas fa-code"></i> Software development
                    </button>
                    <button onclick="sendSuggestion('What are the key topics covered in the lectures?')" class="chip">
                        <i class="fas fa-book-open"></i> Key topics
                    </button>
                    <button onclick="sendSuggestion('Help me understand project stakeholders')" class="chip">
                        <i class="fas fa-users"></i> Project stakeholders
                    </button>
                </div>
            </div>
        </div>

        <!-- ========== INPUT AREA ========== -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <!-- Voice Input Button -->
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="Voice Input">
                    <i class="fas fa-microphone"></i>
                </button>
                <textarea 
                    id="userInput" 
                    placeholder="Ask me anything about your course materials..."
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-hint">
                <i class="fas fa-shield-alt"></i> Your questions are private • Powered by AI • <span id="voiceStatus">Click 🎤 for voice</span>
            </div>
        </div>
    </div>

    <!-- Admin Link -->
    <a href="/admin" class="admin-link" title="Admin Panel">
        <i class="fas fa-cog"></i>
    </a>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
